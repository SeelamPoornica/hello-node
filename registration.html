<!DOCTYPE html>
<html>
  <head>
    <style>
      .box{
        align-items: center ;
        display:flex;
        margin-bottom:15px;
        font-weight: bold;
      }
      .box2{
        text-align: center;
        width:450px;
        margin:50px auto;
        background: #f9f9f9;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,1,0.1);
      }
      form{
        width:400px;
        margin:50px auto;
        background: #f9f9f9;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      }
      .box input{
        flex:1;
        padding:5px;
      }
      .box label{
        width:150px;
        margin-right:20px;
      }
      #checkbox{ 
        display: flex;
        justify-content: flex-start; 
        align-items: center;
        gap: 10px;
      }
      #term{
        margin-right: 10px;
        font-weight: bold
      }
      #submit{
        background-color: #4CAF50;
      }
      table{
        width: 90%;
        margin: auto;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,td{
        padding: 10px;
        border:1px solid #ccc;
      }
    </style>
  </head>

  <body>
    <form id="userData">
      <div class="box">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="name" value="" required>
      </div>
      <div class="box">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email" value="" required>
      </div>
      <div class="box">
        <label>Password</label>
        <input type="password" id="password" placeholder="password" value="" required>
      </div>
      <div class="box">
        <label>Date of birth </label>
        <input type="date" id="dob" value="" max="2007-08-03" min="1965-08-03" required>
      </div>
      <div id="checkbox">
        <input type="checkbox" id="terms" required>
        <p id="term">Accept terms and conditions </p>
      </div>
      <div class="box">
        <input type="submit" value="submit" id="submit">
      </div>
    </form>

    <footer class="box2">
      <h2>Entries</h2>
      <table id="tabledata">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Password</th>
          <th>DOB</th>
          <th>Terms</th>
        </tr>
      </table>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("userData");
        const tabledata = document.getElementById("tabledata");

        const entries = JSON.parse(localStorage.getItem("userEntries")) || [];
        entries.forEach(addRowToTable);

        form.addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
          const dob = document.getElementById("dob").value;
          const terms = document.getElementById("terms").checked ? "Yes" : "No";

          const entry = { name, email, password, dob, terms };

          entries.push(entry);
          localStorage.setItem("userEntries", JSON.stringify(entries));
          addRowToTable(entry);

          form.reset();
        });

        function addRowToTable(entry) {
          const row = document.createElement("tr");

          const cell1 = document.createElement("td");
          cell1.textContent = entry.name;
          row.appendChild(cell1);

          const cell2 = document.createElement("td");
          cell2.textContent = entry.email;
          row.appendChild(cell2);

          const cell3 = document.createElement("td");
          cell3.textContent = entry.password;
          row.appendChild(cell3);

          const cell4 = document.createElement("td");
          cell4.textContent = entry.dob;
          row.appendChild(cell4);

          const cell5 = document.createElement("td");
          cell5.textContent = entry.terms;
          row.appendChild(cell5);

          tabledata.appendChild(row);
        }
      });
    </script>
  </body>
</html>
